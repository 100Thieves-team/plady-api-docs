openapi: 3.0.1
info:
  title: Plady API
  description: Plady REST API contract generated from Spring REST Docs
  version: 0.0.1-SNAPSHOT
servers:
- url: http://localhost:8080
tags: []
paths:
  /api/v1/documents:
    get:
      tags:
      - api
      summary: 문서 목록 조회
      description: 인증된 사용자가 업로드한 PDF 문서 목록과 분석 상태를 조회한다.
      operationId: documentList
      parameters:
      - name: Authorization
        in: header
        description: Bearer access token
        required: true
        schema:
          type: string
        example: Bearer test-access-token
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-documents394150815"
              examples:
                documentList:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "documents" : [ {
                          "documentId" : "018f06e8-23a1-7f52-b021-8f8c9d8f0002",
                          "originalFileName" : "sample.pdf",
                          "contentType" : "application/pdf",
                          "fileSizeBytes" : 12345,
                          "objectKey" : "documents/018f06e8-23a1-7f52-b021-8f8c9d8f0001/018f06e8-23a1-7f52-b021-8f8c9d8f0002/sample.pdf",
                          "pageCount" : null,
                          "processingStatus" : "UPLOAD_REQUESTED",
                          "createdAt" : "2026-06-05T11:00:00Z"
                        } ]
                      },
                      "error" : null
                    }
  /api/v1/examples:
    post:
      tags:
      - api
      summary: 예제 POST 생성
      description: JSON 요청 body를 받아 예제 응답을 반환한다.
      operationId: examplePost
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-examples-1780624183"
            examples:
              examplePost:
                value: |-
                  {
                    "data" : "HELLO_BODY"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-examples-exampleValue191457252"
              examples:
                examplePost:
                  value: |-
                    {
                      "result" : "SUCCESS",
                      "data" : {
                        "result" : "BYE_POST",
                        "date" : "2026-06-07",
                        "datetime" : "2026-06-07T05:38:13.348541149",
